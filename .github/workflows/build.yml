name: Build APK

on:
  push:
    # main only. master is a stale branch, 54 commits behind and holding a
    # single commit that reverts the codebase to v2.5.0; nothing is developed
    # there, so building it on every push was spending minutes on a snapshot
    # nobody ships. Pull requests are still built by the trigger below,
    # whatever branch they come from.
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  # The two inputs below are what turn "Run workflow" into a publish button:
  # GitHub renders a boolean input as a checkbox and a string input as a field,
  # so a release can be cut from the Actions tab without tagging from a
  # computer. Tag pushes still publish on their own, exactly as before.
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Attach the APKs to a GitHub release'
        type: boolean
        default: false
      release_tag:
        description: 'Tag for that release, e.g. v2.8.1 (v2.8.1-rc1 for a test build)'
        type: string
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    # Lifted out of `secrets` because a step's `if:` cannot read that context.
    # Every one of these is empty on a fork or a pull request from one, which
    # is what keeps those builds working: the release build falls back to the
    # debug key when no keystore is configured (see app/build.gradle.kts).
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      RIMBOARD_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      RIMBOARD_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      RIMBOARD_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # One place decides whether this run publishes and under what tag, so the
      # four steps that care cannot drift apart. A tag push publishes itself; a
      # manual run publishes only when the box is ticked, and then the tag has
      # to be given, because a release with no name is not something to guess
      # at.
      - name: Decide whether this build publishes a release
        id: rel
        run: |
          if [ "${{ startsWith(github.ref, 'refs/tags/') }}" = "true" ]; then
            tag="$GITHUB_REF_NAME"
          elif [ "${{ inputs.publish_release }}" = "true" ]; then
            tag="${{ inputs.release_tag }}"
            if [ -z "$tag" ]; then
              echo "::error::Publish was ticked but no tag was given. Re-run with a tag such as v2.8.1."
              exit 1
            fi
            case "$tag" in
              v*) ;;
              *) echo "::error::A release tag has to start with v, e.g. v2.8.1. Got '$tag'."; exit 1 ;;
            esac
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "tag=" >> "$GITHUB_OUTPUT"
            echo "not publishing a release"
            exit 0
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          # A hyphen marks a test build throughout this file.
          case "$tag" in
            *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *)   echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac
          echo "publishing $tag"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Written to the runner's temp dir, never the workspace, so it cannot be
      # picked up by a later step that packages or uploads the checkout.
      - name: Decode the signing key
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/rimboard.jks"
          echo "RIMBOARD_KEYSTORE=$RUNNER_TEMP/rimboard.jks" >> "$GITHUB_ENV"

      # Both flavors, everywhere. The offline build is the one whose whole
      # value is a permission it does not have, so a green run that only
      # covered `online` would be testing the wrong half of the claim.
      - name: Run unit tests
        run: |
          chmod +x gradlew
          ./gradlew testOfflineDebugUnitTest testOnlineDebugUnitTest --no-daemon

      # Fails the build on lint's error-severity issues. Missing translations
      # and format-string mismatches are errors, and both are invisible until
      # the string is shown to someone in that language.
      - name: Lint
        run: ./gradlew lintOfflineDebug lintOnlineDebug --no-daemon

      - name: Build debug APKs
        run: ./gradlew assembleOfflineDebug assembleOnlineDebug --no-daemon

      # Built on every push, not just tags, so a release-only break shows up
      # here rather than at the moment someone cuts a release.
      - name: Build release APKs
        run: ./gradlew assembleOfflineRelease assembleOnlineRelease --no-daemon

      # The check that the two-flavor split actually did what it claims. The
      # unit tests read the manifest sources; this reads the packaged APKs,
      # which is what someone actually installs and what `aapt` will tell them.
      # A merger change or a stray <uses-permission> would sail past everything
      # else in this file and land in a release.
      - name: Verify the offline APK cannot reach the network
        run: |
          AAPT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/aapt"
          offline="$("$AAPT" dump permissions app/build/outputs/apk/offline/release/app-offline-release.apk)"
          online="$("$AAPT" dump permissions app/build/outputs/apk/online/release/app-online-release.apk)"
          echo "$offline"
          if echo "$offline" | grep -q 'android.permission.INTERNET'; then
            echo "::error::the offline APK requests INTERNET"; exit 1
          fi
          if ! echo "$online" | grep -q 'android.permission.INTERNET'; then
            echo "::error::the online APK is missing INTERNET"; exit 1
          fi
          echo "offline APK declares no INTERNET permission; online APK does"

      # Who signed it, printed for every build and checked on tags.
      #
      # Anyone installing this has to be able to tell a build signed with the
      # project's key from one signed with the debug key every Android SDK
      # ships — they are equally installable and only one of them means
      # anything. The fingerprint below is what a release note can be checked
      # against, and `apksigner verify --print-certs` on a downloaded APK
      # prints the same line.
      - name: Report the signing certificate
        run: |
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          certs="$("$BT/apksigner" verify --print-certs \
            app/build/outputs/apk/offline/release/app-offline-release.apk)"
          echo "$certs"
          if echo "$certs" | grep -q 'CN=Android Debug'; then
            echo "::warning::signed with the Android debug key — anyone can forge an update"
            # A test build may go out this way; a real release may not. The
            # distinction is the hyphen that also marks it a pre-release, so
            # v2.8.0-rc1 is allowed through and v2.8.0 is not. Someone
            # installing a finished release should not be trusting a key that
            # ships with every copy of the Android SDK.
            # Applies to the manual publish too, and deliberately: a button
            # that can put a debug-signed build on the releases page under a
            # plain version number would be a way around this rule rather than
            # a convenience.
            if [ "${{ steps.rel.outputs.publish == 'true' && steps.rel.outputs.prerelease == 'false' }}" = "true" ]; then
              echo "::error::a release must not be signed with the debug key. Set the KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS and KEY_PASSWORD secrets, or publish it as a pre-release (v2.8.0-rc1)."
              exit 1
            fi
          fi

      # Named for a human rather than for Gradle's output layout: these end up
      # on a release page where the file name is the only thing distinguishing
      # them, and "app-online-release.apk" says neither which app nor which
      # build it is.
      - name: Name the release APKs
        if: steps.rel.outputs.publish == 'true'
        run: |
          v="${TAG#v}"
          mkdir -p release
          cp app/build/outputs/apk/offline/release/app-offline-release.apk \
             "release/RimBoard-$v-offline.apk"
          cp app/build/outputs/apk/online/release/app-online-release.apk \
             "release/RimBoard-$v-online.apk"
          ls -l release
        env:
          TAG: ${{ steps.rel.outputs.tag }}

      # One artifact per flavor, not one holding both. They are alternatives —
      # nobody installs the pair — and a combined artifact makes you download
      # the build you did not want in order to get the one you did. The names
      # also say which is which before the zip is opened.
      - name: Upload the offline APK
        uses: actions/upload-artifact@v4
        with:
          name: RimBoard-offline-debug
          path: app/build/outputs/apk/offline/debug/app-offline-debug.apk

      - name: Upload the online APK
        uses: actions/upload-artifact@v4
        with:
          name: RimBoard-online-debug
          path: app/build/outputs/apk/online/debug/app-online-debug.apk

      # Written onto the run's own summary page, because that is where someone
      # looking at a finished build actually is. The control that publishes a
      # release lives on the *workflow* page rather than on a run, which is not
      # obvious and is not discoverable from here without being told — so this
      # tells them, with the link, at the moment it is wanted.
      - name: Explain how to publish these APKs
        if: steps.rel.outputs.publish != 'true'
        run: |
          {
            echo "### Publish these APKs to a release"
            echo
            echo "This run only produced artifacts. To attach APKs to the"
            echo "[Releases page](${{ github.server_url }}/${{ github.repository }}/releases):"
            echo
            echo "1. Open [the Build APK workflow](${{ github.server_url }}/${{ github.repository }}/actions/workflows/build.yml) — the workflow page, not this run."
            echo "2. Press **Run workflow** on the right."
            echo "3. Tick **Attach the APKs to a GitHub release** and give a tag, e.g. \`v2.8.1\` (\`v2.8.1-rc1\` for a test build)."
            echo
            echo "Pushing a tag beginning with \`v\` does the same thing on its own."
          } >> "$GITHUB_STEP_SUMMARY"

      # Releases must carry the release build. The debug one is debuggable,
      # which on a keyboard means anything on the device can attach to the
      # process that sees every keystroke.
      #
      # A release page is also the only route onto a phone that works from a
      # phone: Actions artifacts are desktop-only in the GitHub web UI and are
      # served as zips, which Android cannot install.
      - name: Attach APKs to the release
        if: steps.rel.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          # Named explicitly rather than taken from the ref, because a manual
          # run is not on a tag; the action creates the tag when it does not
          # exist yet.
          tag_name: ${{ steps.rel.outputs.tag }}
          # A hyphen in the tag marks a test build — v2.8.0-rc1 — and those are
          # published as pre-releases so nobody arriving at the repository is
          # handed one as though it were finished.
          prerelease: ${{ steps.rel.outputs.prerelease == 'true' }}
          generate_release_notes: true
          files: release/*.apk
          body: |
            Download one APK and open it on the phone. Nothing else is needed —
            no computer, no `adb`, no account.

            - **`offline`** — start here. No `INTERNET` permission at all, so
              Android will not give it a network connection whatever its code
              asks for.
            - **`online`** — only if you want translation or GIF search.

            Then turn it on under **Settings → System → Languages & input →
            On-screen keyboard**. Full instructions, and how to check what you
            downloaded, are in the
            [README](https://github.com/An0nym010/rimboard#installing).
            ${{ steps.rel.outputs.prerelease == 'true' && '
            ---

            > **Test build.** It is signed with the Android debug key, which
            > ships with every copy of the Android SDK — so anyone could forge
            > an update for it, and it should not be treated as trusted
            > software. Installing a properly signed release later will require
            > uninstalling this one first (export your words under Settings →
            > Backup before you do). It has also not been tested on real
            > hardware.' || '' }}
