document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

on data-screen=\"type\" sc-camel-on-click=\"{{ onScreen }}\" style=\"border:0;background:{{ tabTypeBg }};padding:8px 14px;border-radius:9px;font-size:13.5px;font-weight:600;color:{{ tabTypeFg }};cursor:pointer;box-shadow:{{ tabTypeShadow }};transition:background .14s,color .14s\">Keyboard<\u002Fbutton>\n      <button data-screen=\"settings\" sc-camel-on-click=\"{{ onScreen }}\" style=\"border:0;background:{{ tabSettingsBg }};padding:8px 14px;border-radius:9px;font-size:13.5px;font-weight:600;color:{{ tabSettingsFg }};cursor:pointer;box-shadow:{{ tabSettingsShadow }};transition:background .14s,color .14s\">Settings<\u002Fbutton>\n      <button data-screen=\"setup\" sc-camel-on-click=\"{{ onScreen }}\" style=\"border:0;background:{{ tabSetupBg }};padding:8px 14px;border-radius:9px;font-size:13.5px;font-weight:600;color:{{ tabSetupFg }};cursor:pointer;box-shadow:{{ tabSetupShadow }};transition:background .14s,color .14s\">Setup app<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"display:flex;flex-wrap:wrap;gap:40px;align-items:flex-start;justify-content:center\">\n  <div style=\"width:393px;height:812px;box-sizing:border-box;background:#EDF0F5;border-radius:38px;padding:0;box-shadow:0 30px 70px -30px rgba(18,26,42,.45),0 0 0 10px #171C24,0 0 0 11px #2B323C;overflow:hidden;display:flex;flex-direction:column;position:relative\">\n\n    <div style=\"height:34px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 22px;font-size:12.5px;font-weight:600;color:#1B1E24\">\n      <span>14:32<\u002Fspan>\n      <div style=\"display:flex;align-items:center;gap:5px\">\n        <span style=\"width:16px;height:9px;border:1.5px solid #1B1E24;border-radius:2px;display:inline-block;position:relative\"><span style=\"position:absolute;inset:1px;right:5px;background:#1B1E24;border-radius:1px\"><\u002Fspan><\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <sc-if value=\"{{ isType }}\" hint-placeholder-val=\"{{ true }}\">\n      <div style=\"flex:1;min-height:0;display:flex;flex-direction:column;background:#F6F8FB\">\n        <div style=\"flex:none;height:52px;display:flex;align-items:center;gap:12px;padding:0 16px;background:#fff;border-bottom:1px solid #E3E8F0\">\n          <div style=\"width:34px;height:34px;border-radius:50%;background:#DCE6F8;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#3E7BFA\">A<\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column\">\n            <span style=\"font-size:14.5px;font-weight:700\">Notes to self<\u002Fspan>\n            <span style=\"font-size:11.5px;color:#697180\">draft \u00b7 not sent anywhere<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"flex:1;min-height:0;overflow:auto;scrollbar-width:none;display:flex;flex-direction:column;justify-content:flex-end;gap:8px;padding:14px 14px 10px\">\n          <div style=\"align-self:flex-start;max-width:78%;background:#fff;border-radius:16px 16px 16px 5px;padding:9px 13px;font-size:14px;line-height:1.45;box-shadow:0 1px 2px rgba(21,28,44,.07)\">The offline build has no INTERNET permission at all.<\u002Fdiv>\n          <div style=\"align-self:flex-end;max-width:78%;background:#3E7BFA;color:#fff;border-radius:16px 16px 5px 16px;padding:9px 13px;font-size:14px;line-height:1.45\">So the socket probe fails with EACCES.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"flex:none;padding:8px 12px 12px;background:#F6F8FB\">\n          <div style=\"min-height:42px;display:flex;align-items:center;background:#fff;border:1px solid #DDE4EE;border-radius:21px;padding:10px 16px;font-size:14.5px;line-height:1.35;color:#1B1E24;box-shadow:0 1px 2px rgba(21,28,44,.05)\">\n            <span style=\"white-space:pre-wrap;word-break:break-word\">{{ text }}<\u002Fspan><span style=\"display:inline-block;width:1.5px;height:17px;background:#3E7BFA;margin-left:1px;animation:none\"><\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isSettings }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"flex:1;min-height:0;overflow:auto;background:#F6F8FB\">\n        <div style=\"padding:18px 20px 10px;background:#fff;border-bottom:1px solid #E3E8F0\">\n          <div style=\"font-size:22px;font-weight:700\">Settings<\u002Fdiv>\n          <div style=\"font-size:12.5px;color:#697180;margin-top:2px\">RimBoard 2.9.1-offline<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;background:#fff;margin-top:10px;border-top:1px solid #E9EDF4;border-bottom:1px solid #E9EDF4\">\n          <div style=\"padding:14px 20px;border-bottom:1px solid #F0F3F8\"><div style=\"font-size:15px;font-weight:600\">Active languages<\u002Fdiv><div style=\"font-size:12.5px;color:#697180;margin-top:2px\">Switch with the \ud83c\udf10 key or long-press comma<\u002Fdiv><\u002Fdiv>\n          <div style=\"padding:14px 20px;border-bottom:1px solid #F0F3F8;font-size:15px;font-weight:600\">Preferences<\u002Fdiv>\n          <div style=\"padding:14px 20px;border-bottom:1px solid #F0F3F8;font-size:15px;font-weight:600\">Look and feel<\u002Fdiv>\n          <div style=\"padding:14px 20px;border-bottom:1px solid #F0F3F8;font-size:15px;font-weight:600\">Suggestions<\u002Fdiv>\n          <div style=\"padding:14px 20px;border-bottom:1px solid #F0F3F8;font-size:15px;font-weight:600\">Glide typing<\u002Fdiv>\n          <div style=\"padding:14px 20px;border-bottom:1px solid #F0F3F8;font-size:15px;font-weight:600\">Clipboard<\u002Fdiv>\n          <div style=\"padding:14px 20px;border-bottom:1px solid #F0F3F8;font-size:15px;font-weight:600\">Privacy<\u002Fdiv>\n          <div style=\"padding:14px 20px;border-bottom:1px solid #F0F3F8\"><div style=\"font-size:15px;font-weight:600\">Network<\u002Fdiv><div style=\"font-size:12.5px;color:#697180;margin-top:2px\">What this build can reach, and proof of it<\u002Fdiv><\u002Fdiv>\n          <div style=\"padding:14px 20px;border-bottom:1px solid #F0F3F8;font-size:15px;font-weight:600\">Advanced<\u002Fdiv>\n          <div style=\"padding:14px 20px;border-bottom:1px solid #F0F3F8;font-size:15px;font-weight:600\">Typing statistics<\u002Fdiv>\n          <div style=\"padding:14px 20px;border-bottom:1px solid #F0F3F8;font-size:15px;font-weight:600\">Backup<\u002Fdiv>\n          <div style=\"padding:14px 20px;font-size:15px;font-weight:600\">About<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"padding:16px 20px 28px;font-size:12px;line-height:1.5;color:#8A93A1\">Permissions held by this build: VIBRATE, READ_CONTACTS, READ_USER_DICTIONARY.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isSetup }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"flex:1;min-height:0;overflow:auto;background:#fff;padding:24px\">\n        <div style=\"font-size:26px;font-weight:700;letter-spacing:-0.02em\">Welcome to RimBoard<\u002Fdiv>\n        <div style=\"font-size:14px;color:#5A6372;margin-top:8px\">A private, open-source keyboard.<\u002Fdiv>\n\n        <div style=\"margin-top:28px;font-size:16px;font-weight:700\">1. Enable RimBoard<\u002Fdiv>\n        <div style=\"font-size:13px;color:#5A6372;margin-top:2px\">Turn on RimBoard in your system keyboard list.<\u002Fdiv>\n        <div style=\"font-size:13.5px;font-weight:700;color:#2FA36B;margin-top:4px\">\u2713 Done<\u002Fdiv>\n        <button style=\"margin-top:10px;width:100%;height:44px;border:0;border-radius:12px;background:#3E7BFA;color:#fff;font-size:14.5px;font-weight:700;cursor:pointer\" style-hover=\"background:#2C63D6\">Open keyboard settings<\u002Fbutton>\n\n        <div style=\"margin-top:24px;font-size:16px;font-weight:700\">2. Select RimBoard<\u002Fdiv>\n        <div style=\"font-size:13px;color:#5A6372;margin-top:2px\">Choose RimBoard as your current keyboard.<\u002Fdiv>\n        <div style=\"font-size:13.5px;font-weight:700;color:#697180;margin-top:4px\">Not yet<\u002Fdiv>\n        <button style=\"margin-top:10px;width:100%;height:44px;border:0;border-radius:12px;background:#3E7BFA;color:#fff;font-size:14.5px;font-weight:700;cursor:pointer\" style-hover=\"background:#2C63D6\">Switch keyboard<\u002Fbutton>\n\n        <div style=\"margin-top:24px;font-size:16px;font-weight:700\">3. Make it yours<\u002Fdiv>\n        <div style=\"font-size:13px;color:#5A6372;margin-top:2px\">Themes, incognito, number row, languages and more.<\u002Fdiv>\n        <button style=\"margin-top:10px;width:100%;height:44px;border:0;border-radius:12px;background:#E2E9F6;color:#2C63D6;font-size:14.5px;font-weight:700;cursor:pointer\" style-hover=\"background:#D3DFF3\">Open RimBoard settings<\u002Fbutton>\n\n        <div style=\"margin-top:28px;min-height:56px;border:1px solid #DDE4EE;border-radius:14px;padding:12px 14px;font-size:14.5px;color:#1B1E24;background:#F8FAFD\"><span style=\"white-space:pre-wrap;word-break:break-word\">{{ setupText }}<\u002Fspan><span style=\"display:inline-block;width:1.5px;height:17px;background:#3E7BFA;margin-left:1px;vertical-align:-3px\"><\u002Fspan><\u002Fdiv>\n        <div style=\"font-size:12px;color:#8A93A1;margin-top:8px\">Try typing here\u2026<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <div style=\"flex:none;background:#EDF0F5;padding:0 3px 5px;user-select:none\">\n\n      <div style=\"height:44px;display:flex;align-items:center;gap:0;padding:0 3px\">\n        <button sc-camel-on-click=\"{{ onDrawer }}\" style=\"flex:none;width:34px;height:34px;display:flex;align-items:center;justify-content:center;border:0;background:transparent;border-radius:10px;color:#363B44;cursor:pointer\" style-active=\"background:#DBE1EB\">\n          <svg style=\"width:20px;height:20px\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><use href=\"{{ chevronIcon }}\"><\u002Fuse><\u002Fsvg>\n        <\u002Fbutton>\n\n        <sc-if value=\"{{ drawerOpen }}\" hint-placeholder-val=\"{{ false }}\">\n          <d  \"Share text\"],\n  [\"theme\", \"Switch theme\"],\n  [\"resize\", \"Resize keyboard\"],\n  [\"settings\", \"Settings\"]\n];\n\nconst PINNED = [\"toolbar\", \"clipboard\", \"incognito\", \"translate\", \"settings\"];\n\nconst EMOJIS = \"\ud83d\ude0a \ud83d\ude02 \ud83d\ude42 \ud83d\ude0d \ud83d\ude09 \ud83d\ude0e \ud83e\udd14 \ud83d\ude34 \ud83d\ude05 \ud83e\udd72 \ud83d\ude07 \ud83d\ude43 \ud83e\udd1d \ud83d\udc4d \ud83d\udc4f \ud83d\ude4f \ud83d\udcaa \u270c \ud83d\udc40 \ud83e\udde0 \u2764 \ud83d\udd25 \u2728 \u2b50 \ud83c\udf89 \ud83c\udf88 \ud83c\udf40 \ud83c\udf19 \u2600 \u2601 \ud83c\udf27 \ud83c\udf55 \ud83c\udf54 \ud83c\udf4e \u2615 \ud83c\udf7a \ud83d\udc3b \ud83d\udc31 \ud83d\udc36 \ud83e\udd8a \ud83d\ude97 \u2708 \ud83c\udfe0 \ud83d\udcf1 \ud83d\udcbb \u2328 \ud83d\udd12 \ud83d\udccb\".split(\" \");\n\nclass Component extends DCLogic {\n  state = {\n    text: \"So the socket probe fails with EACCES. \",\n    setupText: \"\",\n    screen: \"type\",\n    layout: \"abc\",\n    shift: 1,\n    panel: null,\n    drawer: false,\n    incognito: false\n  };\n\n  target() { return this.state.screen === \"setup\" ? \"setupText\" : \"text\"; }\n\n  put(s) {\n    const k = this.target();\n    this.setState(st => ({ [k]: st[k] + s, shift: k === \"text\" && st.shift === 1 ? 0 : st.shift }));\n  }\n\n  key = (e) => {\n    const k = e.currentTarget.dataset.k;\n    const field = this.target();\n    if (k === \"SHIFT\") return this.setState(st => ({ shift: st.shift === 0 ? 1 : st.shift === 1 ? 2 : 0 }));\n    if (k === \"BACK\") return this.setState(st => ({ [field]: st[field].slice(0, -1) }));\n    if (k === \"MODE\") return this.setState(st => ({ layout: st.layout === \"abc\" ? \"sym\" : \"abc\" }));\n    if (k === \"ABC\") return this.setState({ panel: null, layout: \"abc\" });\n    if (k === \"SPACE\") return this.commitSpace();\n    if (k === \"ENTER\") return this.put(\"\\n\");\n    if (k === \"LANG\") return;\n    if (!k) return;\n    const ch = this.state.layout === \"abc\" && this.state.shift > 0 ? k.toUpperCase() : k;\n    this.put(ch);\n  };\n\n  commitSpace() {\n    const field = this.target();\n    const t = this.state[field];\n    const m = t.match(/([A-Za-z\u00c0-\u00ff]+)$/);\n    const best = m ? this.best(m[1]) : null;\n    if (best && best !== m[1]) {\n      const fixed = t.slice(0, t.length - m[1].length) + this.matchCase(m[1], best) + \" \";\n      this.setState({ [field]: fixed });\n    } else {\n      this.setState({ [field]: t + \" \" });\n    }\n  }\n\n  matchCase(src, out) {\n    return src[0] === src[0].toUpperCase() ? out[0].toUpperCase() + out.slice(1) : out;\n  }\n\n  // The completion space would commit, or null when the word stands on its own.\n  best(word) {\n    const w = word.toLowerCase();\n    return WORDS.find(x => x.startsWith(w) && x !== w) || null;\n  }\n\n  // Three distinct chips. Completions first, then same-initial words, then\n  // filler -- padding a short list by repeating the typed word put the same\n  // string in two chips side by side (\"keyboard | keyboard | keep\").\n  rank(word) {\n    const w = word.toLowerCase();\n    const out = [];\n    const add = (x) => {\n      if (x && !out.some(o => o.toLowerCase() === x.toLowerCase())) out.push(x);\n    };\n    add(word);\n    WORDS.filter(x => x.startsWith(w) && x !== w).forEach(add);\n    WORDS.filter(x => x[0] === w[0]).forEach(add);\n    [\"and\", \"the\", \"to\"].forEach(add);\n    return out.slice(0, 3);\n  }\n\n  chip = (e) => {\n    const field = this.target();\n    const word = e.currentTarget.dataset.word;\n    this.setState(st => {\n      const t = st[field];\n      const m = t.match(/([A-Za-z\u00c0-\u00ff]+)$/);\n      const base = m ? t.slice(0, t.length - m[1].length) : t;\n      return { [field]: base + word + \" \" };\n    });\n  };\n\n  emoji = (e) => this.put(e.currentTarget.dataset.emoji);\n\n  drawerToggle = () => this.setState(st => ({ drawer: !st.drawer, panel: st.panel === \"tools\" ? null : st.panel }));\n\n  tool = (e) => {\n    const id = e.currentTarget.dataset.tool;\n    if (id === \"toolbar\") return this.setState({ panel: \"tools\", drawer: false });\n    if (id === \"clipboard\") return this.setState({ panel: \"clip\", drawer: false });\n    if (id === \"emoji\") return this.setState({ panel: \"emoji\", drawer: false });\n    if (id === \"incognito\") return this.setState(st => ({ incognito: !st.incognito, drawer: false }));\n    if (id === \"settings\") return this.setState({ screen: \"settings\", drawer: false, panel: null });\n    if (id === \"hide\") return this.setState({ panel: null, drawer: false });\n    this.setState({ drawer: false, panel: null });\n  };\n\n  screenPick = (e) => this.setState({ screen: e.currentTarget.dataset.screen, panel: null, drawer: false });\n\n  renderVals() {\n    const st = this.state;\n    const field = st.screen === \"setup\" ? st.setupText : st.text;\n    const m = field.match(/([A-Za-z\u00c0-\u00ff]+)$/);\n    const typed = m ? m[1] : \"\";\n    // The highlighted chip is the one space commits, so with nothing to\n    // correct to it is the word as typed -- not the neighbour.\n    const pick = typed && this.best(typed) ? 1 : 0;\n    const words = (typed ? this.rank(typed) : [\"I\", \"The\", \"It\"]).filter(Boolean);\n    // Filter before mapping: dropping a chip afterwards left the new first\n    // chip carrying the divider meant to sit between two chips.\n    const chips = words.map((w, i) => ({\n      word: w,\n      weight: i === pick ? 700 : 500,\n      color: i === pick ? \"#3E7BFA\" : \"#363B44\",\n      divider: i === 0 ? \"transparent\" : \"#D3D9E3\"\n    }));\n\n    const tools = TOOLS.map(([id, label]) => ({ id, label, href2: \"#r-\" + id }));\n\n    return {\n      text: st.text,\n      setupText: st.setupText,\n      chips,\n      emojis: EMOJIS,\n      clips: [\n        { text: \"java.net.SocketException: socket failed: EACCES (Permission denied)\", pinColor: \"#3E7BFA\" },\n        { text: \"aapt dump permissions app-offline-release.apk\", pinColor: \"#B4BCC8\" },\n        { text: \"2.9.1-offline\", pinColor: \"#B4BCC8\" },\n        { text: \"com.rimboard.keyboard/.spell.RimSpellService\", pinColor: \"#B4BCC8\" }\n      ],\n      tools,\n      pinned: PINNED.map(id => tools.find(t => t.id === id)),\n      rest: tools.filter(t => !PINNED.includes(t.id)),\n      tabTypeFg: st.screen === \"type\" ? \"#3E7BFA\" : \"#5A6372\",\n      tabTypeBg: st.screen === \"type\" ? \"#FFFFFF\" : \"transparent\",\n      tabTypeShadow: st.screen === \"type\" ? \"0 1px 2px rgba(27,30,36,.10)\" : \"none\",\n      tabSettingsFg: st.screen === \"settings\" ? \"#3E7BFA\" : \"#5A6372\",\n      tabSettingsBg: st.screen === \"settings\" ? \"#FFFFFF\" : \"transparent\",\n      tabSettingsShadow: st.screen === \"settings\" ? \"0 1px 2px rgba(27,30,36,.10)\" : \"none\",\n      tabSetupFg: st.screen === \"setup\" ? \"#3E7BFA\" : \"#5A6372\",\n      tabSetupBg: st.screen === \"setup\" ? \"#FFFFFF\" : \"transparent\",\n      tabSetupShadow: st.screen === \"setup\" ? \"0 1px 2px rgba(27,30,36,.10)\" : \"none\",\n      isType: st.screen === \"type\",\n      isSettings: st.screen === \"settings\",\n      isSetup: st.screen === \"setup\",\n      isAbc: st.layout === \"abc\",\n      isSym: st.layout === \"sym\",\n      showKeys: st.panel === null,\n      showEmoji: st.panel === \"emoji\",\n      showClip: st.panel === \"clip\",\n      showTools: st.panel === \"tools\",\n      drawerOpen: st.drawer,\n      stripOpen: !st.drawer,\n      incognito: st.incognito,\n      caseMode: st.shift > 0 ? \"uppercase\" : \"lowercase\",\n      shiftBg: st.shift === 2 ? \"#3E7BFA\" : \"#DBE1EB\",\n      shiftFg: st.shift === 2 ? \"#FFFFFF\" : (st.shift === 1 ? \"#3E7BFA\" : \"#1B1E24\"),\n      modeLabel: st.layout === \"abc\" ? \"?123\" : \"ABC\",\n      spaceLabel: this.props.spaceLabel ?? \"English\",\n      chevronIcon: st.drawer ? \"#r-chevron-left\" : \"#r-chevron-right\",\n      onKey: this.key,\n      onChip: this.chip,\n      onEmoji: this.emoji,\n      onTool: this.tool,\n      onDrawer: this.drawerToggle,\n      onScreen: this.screenPick\n    };\n  }\n}\n<\u002Fscript>\n\n\n<div id=\"__claude_design_branding\"><style>#__claude_design_branding{position:fixed;right:16px;bottom:16px;z-index:2147483646;display:flex;align-items:center;gap:7px;height:30px;padding:0 5px 0 10px;border-radius:999px;font-family:\"Anthropic Sans\",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;font-size:12.5px;font-weight:400;line-height:1;letter-spacing:normal;text-transform:none;color:#141413;background:rgba(255,255,255,.86);-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px);box-shadow:0 0 0 .5px rgba(31,30,29,.14),0 2px 10px rgba(0,0,0,.09)}\n#__claude_design_branding *{box-sizing:border-box;margin:0}\n#__claude_design_branding a{color:inherit;text-decoration:none;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}\n#__claude_design_branding a:hover span{text-decoration:underline}\n#__claude_design_branding svg{flex:none}\n#__claude_design_branding a svg{color:#D97757}\n#__claude_design_branding button{width:20px;height:20px;padding:0;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:currentColor;opacity:.55;border:0;background:none;cursor:pointer;flex:none;font:inherit;transition:opacity .14s}\n#__claude_design_branding button:hover{opacity:1;background:rgba(127,127,127,.22)}\n@media print{#__claude_design_branding{display:none}}<\u002Fstyle><a href=\"https://claude.com/product/design\" target=\"_blank\" rel=\"noopener noreferrer\"><svg width=\"14\" height=\"14\" viewBox=\"0 0 20 21\" fill=\"none\" aria-hidden=\"true\"><path fill=\"currentColor\" d=\"M9.99902 0C15.5258 0.000170936 19.999 4.50643 19.999 10.0547C19.999 11.7656 19.5863 12.9976 18.7861 13.8203C17.9924 14.6362 16.9465 14.9138 15.9854 15.0078C15.05 15.0993 14.0097 15.0262 13.2549 15.0186C12.8524 15.0145 12.5177 15.0267 12.2441 15.0703C11.9682 15.1144 11.8143 15.1813 11.73
